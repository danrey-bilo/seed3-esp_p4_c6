<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="906" viewBox="0 0 1200 906" role="img" aria-labelledby="title desc">
<title id="title">SPI wiring: Daisy Seed3 and ESP32-P4</title>
<desc id="desc">Signal map: D8 to GPIO2 SCLK; D10 to GPIO3 MOSI; D9 to GPIO4 MISO; D7 to GPIO5 CS; D0 to GPIO28 READY; D13 PB6 pin 14 TX to GPIO30 RX; D14 PB7 pin 15 RX to GPIO31 TX; DGND to GND. Do not join 3V3 rails.</desc>
<defs><marker id="arrow0" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7856c2"/></marker>
<marker id="arrow1" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2563b7"/></marker>
<marker id="arrow2" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#07866b"/></marker>
<marker id="arrow3" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7856c2"/></marker>
<marker id="arrow4" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#0b8696"/></marker>
<marker id="arrow5" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#526781"/></marker>
<marker id="arrow6" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#526781"/></marker>
<marker id="arrow7" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#35465b"/></marker></defs>
<rect width="1200" height="906" rx="20" fill="#f6f8fc"/>
<g font-family="Segoe UI, Arial, sans-serif">
  <text x="52" y="66" font-size="34" font-weight="700" fill="#142337">Between the boards — SPI + READY + UART</text>
  <text x="52" y="104" font-size="20" fill="#52647b">D… = libDaisy names · signal map, not a physical pin layout</text>
  <rect x="52" y="144" width="310" height="600" rx="16" fill="#e9f7f1" stroke="#b0d9ca" stroke-width="2"/>
  <rect x="838" y="144" width="310" height="600" rx="16" fill="#ecf2fc" stroke="#b4c9e8" stroke-width="2"/>
  <text x="82" y="186" font-size="27" font-weight="700" fill="#115947">Daisy Seed3</text>
  <text x="82" y="216" font-size="18" fill="#43695d">SPI slave · audio clock master</text>
  <text x="868" y="186" font-size="27" font-weight="700" fill="#234e88">ESP32-P4</text>
  <text x="868" y="216" font-size="18" fill="#4b6586">SPI master · rev1.x</text>
  <text x="82" y="268" font-size="23" font-weight="600" fill="#173c32">D8</text>
  <text x="1118" y="268" text-anchor="end" font-size="23" font-weight="600" fill="#253c5c">GPIO2</text>
  <circle cx="362" cy="260" r="5" fill="#7856c2"/><circle cx="838" cy="260" r="5" fill="#7856c2"/>
  <path d="M830 260H372" fill="none" stroke="#7856c2" stroke-width="3"  marker-end="url(#arrow0)"/>
  <text x="600" y="248" text-anchor="middle" font-size="20" font-weight="600" fill="#7856c2">SCLK · 20 MHz</text>
<text x="82" y="328" font-size="23" font-weight="600" fill="#173c32">D10</text>
  <text x="1118" y="328" text-anchor="end" font-size="23" font-weight="600" fill="#253c5c">GPIO3</text>
  <circle cx="362" cy="320" r="5" fill="#2563b7"/><circle cx="838" cy="320" r="5" fill="#2563b7"/>
  <path d="M830 320H372" fill="none" stroke="#2563b7" stroke-width="3"  marker-end="url(#arrow1)"/>
  <text x="600" y="308" text-anchor="middle" font-size="20" font-weight="600" fill="#2563b7">MOSI · playback</text>
<text x="82" y="388" font-size="23" font-weight="600" fill="#173c32">D9</text>
  <text x="1118" y="388" text-anchor="end" font-size="23" font-weight="600" fill="#253c5c">GPIO4</text>
  <circle cx="362" cy="380" r="5" fill="#07866b"/><circle cx="838" cy="380" r="5" fill="#07866b"/>
  <path d="M370 380H828" fill="none" stroke="#07866b" stroke-width="3"  marker-end="url(#arrow2)"/>
  <text x="600" y="368" text-anchor="middle" font-size="20" font-weight="600" fill="#07866b">MISO · capture</text>
<text x="82" y="448" font-size="23" font-weight="600" fill="#173c32">D7</text>
  <text x="1118" y="448" text-anchor="end" font-size="23" font-weight="600" fill="#253c5c">GPIO5</text>
  <circle cx="362" cy="440" r="5" fill="#7856c2"/><circle cx="838" cy="440" r="5" fill="#7856c2"/>
  <path d="M830 440H372" fill="none" stroke="#7856c2" stroke-width="3"  marker-end="url(#arrow3)"/>
  <text x="600" y="428" text-anchor="middle" font-size="20" font-weight="600" fill="#7856c2">CS · chip select</text>
<text x="82" y="508" font-size="23" font-weight="600" fill="#173c32">D0</text>
  <text x="1118" y="508" text-anchor="end" font-size="23" font-weight="600" fill="#253c5c">GPIO28</text>
  <circle cx="362" cy="500" r="5" fill="#0b8696"/><circle cx="838" cy="500" r="5" fill="#0b8696"/>
  <path d="M370 500H828" fill="none" stroke="#0b8696" stroke-width="3"  marker-end="url(#arrow4)"/>
  <text x="600" y="488" text-anchor="middle" font-size="20" font-weight="600" fill="#0b8696">READY · data available</text>
<text x="82" y="568" font-size="23" font-weight="600" fill="#173c32">D13 / TX</text>
  <text x="82" y="591" font-size="18" fill="#43695d">pin 14 · PB6</text>
  <text x="1118" y="568" text-anchor="end" font-size="23" font-weight="600" fill="#253c5c">GPIO30 / RX</text>
  <circle cx="362" cy="560" r="5" fill="#526781"/><circle cx="838" cy="560" r="5" fill="#526781"/>
  <path d="M370 560H828" fill="none" stroke="#526781" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow5)"/>
  <text x="600" y="548" text-anchor="middle" font-size="20" font-weight="600" fill="#526781">UART · control / meters</text>
<text x="82" y="628" font-size="23" font-weight="600" fill="#173c32">D14 / RX</text>
  <text x="82" y="651" font-size="18" fill="#43695d">pin 15 · PB7</text>
  <text x="1118" y="628" text-anchor="end" font-size="23" font-weight="600" fill="#253c5c">GPIO31 / TX</text>
  <circle cx="362" cy="620" r="5" fill="#526781"/><circle cx="838" cy="620" r="5" fill="#526781"/>
  <path d="M830 620H372" fill="none" stroke="#526781" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow6)"/>
  <text x="600" y="608" text-anchor="middle" font-size="20" font-weight="600" fill="#526781">UART · control / meters</text>
<text x="82" y="688" font-size="23" font-weight="600" fill="#173c32">DGND</text>
  <text x="1118" y="688" text-anchor="end" font-size="23" font-weight="600" fill="#253c5c">GND</text>
  <circle cx="362" cy="680" r="5" fill="#35465b"/><circle cx="838" cy="680" r="5" fill="#35465b"/>
  <path d="M370 680H828" fill="none" stroke="#35465b" stroke-width="4"  />
  <text x="600" y="668" text-anchor="middle" font-size="20" font-weight="600" fill="#35465b">Common ground</text>
  <rect x="52" y="770" width="1096" height="78" rx="12" fill="#fff4de" stroke="#e7c778"/>
  <text x="76" y="802" font-size="22" font-weight="700" fill="#7c5010">Common ground required. Do not connect the boards' 3V3 rails.</text>
  <text x="76" y="831" font-size="19" fill="#785c2d">SPI mode 0 · short wires · verify wiring before applying power</text>
  <text x="52" y="885" font-size="18" fill="#55677d">MOSI: PC → Seed · MISO: Seed → PC · UART: control and telemetry, not audio</text>
</g>
</svg>
